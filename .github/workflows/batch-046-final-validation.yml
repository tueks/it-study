name: Batch 046 final validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  validate:
    if: github.head_ref == 'agent/batch-046-expansion-wave-01-04'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: agent/batch-046-expansion-wave-01-04
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Validate batch 046 final states
        working-directory: frontend
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile } from 'node:fs/promises'
          import { join, relative, resolve } from 'node:path'
          import { parse } from 'yaml'

          const repo = resolve('..')
          const batch = 'batch-046-expansion-wave-01-04'
          const expected = new Set([
            'entity-tree',
            'entity-binary-tree',
            'entity-binary-search-tree',
            'entity-heap',
            'entity-graph',
            'entity-trie',
            'entity-sorting-algorithm',
            'entity-search-algorithm',
            'entity-big-o-notation',
            'entity-variable',
            'entity-constant',
            'entity-data-type',
          ])
          const expectedSources = new Set([
            'source-mit-ocw-introduction-to-algorithms-2011',
            'source-iso-c-n1570-2011',
          ])
          const allowedAliasKinds = new Set(['acronym','translation','notation','common','alternate','historical'])
          const allowedSourceTypes = new Set(['primary-source','institutional-source','standard','official-documentation','academic-publication','secondary-source','vendor-source','historical-source'])

          async function markdownFiles(dir) {
            const entries = await readdir(dir, { withFileTypes: true })
            const nested = await Promise.all(entries.map(async (entry) => {
              const path = join(dir, entry.name)
              if (entry.isDirectory()) return markdownFiles(path)
              if (!entry.name.endsWith('.md') || entry.name === 'AGENTS.md') return []
              return [path]
            }))
            return nested.flat().sort()
          }

          async function record(path) {
            const text = await readFile(path, 'utf8')
            const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---/)
            if (!match) throw new Error(`Frontmatter ausente: ${relative(repo, path)}`)
            const data = parse(match[1])
            return { ...data, sourcePath: relative(repo, path).replaceAll('\\', '/') }
          }

          const entities = await Promise.all((await markdownFiles(join(repo, 'content/entities'))).map(record))
          const sources = await Promise.all((await markdownFiles(join(repo, 'content/sources'))).map(record))
          const batchEntities = entities.filter((item) => item.batch === batch)
          const batchSources = sources.filter((item) => item.batch === batch)
          const errors = []
          const assert = (condition, message) => { if (!condition) errors.push(message) }

          const globalIds = new Set()
          for (const item of [...entities, ...sources]) {
            assert(!globalIds.has(item.id), `ID duplicado global: ${item.id}`)
            globalIds.add(item.id)
          }

          assert(batchEntities.length === 12, `Entidades del lote: ${batchEntities.length}, esperado 12`)
          assert(batchSources.length === 2, `Fuentes del lote: ${batchSources.length}, esperado 2`)
          assert([...expected].every((id) => batchEntities.some((x) => x.id === id)), 'Las entidades no coinciden con el inventario autorizado')
          assert([...expectedSources].every((id) => batchSources.some((x) => x.id === id)), 'Las fuentes nuevas no coinciden con el plan')

          const entityIds = new Set(entities.map((x) => x.id))
          const sourceIds = new Set(sources.map((x) => x.id))
          const aliasOwner = new Map()
          const normalize = (value) => value.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim()

          for (const item of batchEntities) {
            assert(item.editorialStatus === 'approved', `${item.id}: editorialStatus no approved`)
            assert(item.verificationStatus === 'verified', `${item.id}: verificationStatus no verified`)
            assert(Boolean(item.reviewedAt), `${item.id}: reviewedAt ausente`)
            assert(item.primaryDomain === 'domain-fundamentos-computacion', `${item.id}: dominio incorrecto`)
            assert(Array.isArray(item.subdomains) && item.subdomains.length === 1, `${item.id}: subdomain inválido`)
            for (const source of item.sources ?? []) assert(sourceIds.has(source), `${item.id}: fuente inexistente ${source}`)
            for (const target of item.prerequisites ?? []) {
              assert(target !== item.id, `${item.id}: autorreferencia prerequisite`)
              assert(entityIds.has(target), `${item.id}: prerequisite inexistente ${target}`)
            }
            for (const target of item.related ?? []) {
              assert(target !== item.id, `${item.id}: autorreferencia related`)
              assert(entityIds.has(target), `${item.id}: related inexistente ${target}`)
            }
            for (const relation of item.relations ?? []) {
              assert(relation.targetId !== item.id, `${item.id}: autorrelación`)
              assert(entityIds.has(relation.targetId), `${item.id}: relación inexistente ${relation.targetId}`)
              assert(Boolean(relation.relationType), `${item.id}: relationType ausente`)
              assert(Boolean(relation.note), `${item.id}: note ausente`)
            }
            for (const alias of item.aliases ?? []) {
              assert(allowedAliasKinds.has(alias.kind), `${item.id}: alias kind no permitido ${alias.kind}`)
              const key = normalize(alias.value)
              const previous = aliasOwner.get(key)
              assert(!previous || previous === item.id, `${item.id}: alias colisiona con ${previous}: ${alias.value}`)
              aliasOwner.set(key, item.id)
            }
          }

          for (const source of batchSources) {
            assert(source.editorialStatus === 'approved', `${source.id}: editorialStatus no approved`)
            assert(source.verificationStatus === 'verified', `${source.id}: verificationStatus no verified`)
            assert(Boolean(source.reviewedAt), `${source.id}: reviewedAt ausente`)
            assert(allowedSourceTypes.has(source.sourceType), `${source.id}: sourceType no permitido ${source.sourceType}`)
          }

          const graph = new Map(entities.map((x) => [x.id, (x.prerequisites ?? []).filter((id) => entityIds.has(id))]))
          const visiting = new Set()
          const visited = new Set()
          function visit(id) {
            if (visiting.has(id)) { errors.push(`Ciclo de prerequisites detectado en ${id}`); return }
            if (visited.has(id)) return
            visiting.add(id)
            for (const dep of graph.get(id) ?? []) visit(dep)
            visiting.delete(id)
            visited.add(id)
          }
          for (const id of expected) visit(id)

          if (errors.length) {
            console.error(errors.map((x) => `- ${x}`).join('\n'))
            process.exit(1)
          }
          console.log(`B046 válido para revisión del Responsable: ${batchEntities.length} entidades y ${batchSources.length} fuentes approved/verified.`)
          EOF

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Run build
        working-directory: frontend
        run: npm run build

      - name: Prepare final owner review package
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          if [ "$(git log -1 --pretty=%s)" = "chore: prepare batch 046 for owner review" ]; then
            echo "Final package already prepared."
            exit 0
          fi
          python - <<'PY'
          from pathlib import Path
          import os

          batch = 'batch-046-expansion-wave-01-04'
          run_id = os.environ['RUN_ID']

          register = Path('work/EXPANSION-WAVE-REGISTER.md')
          text = register.read_text(encoding='utf-8')
          text = text.replace(
              '| `batch-046-expansion-wave-01-04` | `wave-01` | 12 | `candidate-tree` | `candidate-data-type` | `authorized` |',
              '| `batch-046-expansion-wave-01-04` | `wave-01` | 12 | `candidate-tree` | `candidate-data-type` | `accepted` |',
          )
          transitions = [
              '| `batch-046-expansion-wave-01-04` | `2026-07-27` | `authorized` | `in-production` | Preflight conforme y alcance exacto de 12 candidatos cargado. |',
              '| `batch-046-expansion-wave-01-04` | `2026-07-27` | `in-production` | `in-review` | Producción 12/12, 2 fuentes y autoevaluación conformes. |',
              f'| `batch-046-expansion-wave-01-04` | `2026-07-27` | `in-review` | `accepted` | 12 entidades y 2 fuentes en `approved` / `verified`; workflow run `{run_id}`, tests y build conformes; PR #7 listo para revisión y merge manual. |',
          ]
          for transition in transitions:
              if transition not in text:
                  text = text.rstrip() + '\n' + transition + '\n'
          register.write_text(text, encoding='utf-8')

          delivery = Path(f'deliveries/{batch}')
          (delivery / 'validation-report.md').write_text(f'''# Validación — `{batch}`

## Estado

`conforming-for-owner-review`

## Resultado automatizado

- GitHub Actions run: `{run_id}`.
- Frontmatter YAML: conforme.
- Entidades esperadas: 12/12.
- Fuentes nuevas: 2/2.
- IDs, aliases, fuentes y referencias: conformes.
- Ciclos de prerequisites: ninguno.
- `npm test`: conforme.
- `npm run build`: conforme.

## Disposición

El último commit conserva las 12 entidades y 2 fuentes en `approved` / `verified` y deja el lote en `accepted`. El PR #7 puede entregarse al Responsable del proyecto.
''', encoding='utf-8')

          (delivery / 'review-gate-status.md').write_text(f'''# Estado de entrega para revisión del Responsable — `{batch}`

## Estado

`ready-for-owner-review`

## Paquete final propuesto

- 12 entidades en `approved` / `verified`.
- 2 fuentes nuevas en `approved` / `verified`.
- Lote en `accepted` dentro del registro de ondas.
- Preflight, investigación y autoevaluación conformes.
- Validación de contenido, `npm test` y `npm run build` conformes en run `{run_id}`.
- PR #7 sin cambios operativos pendientes antes del merge.

## Semántica

Los estados preparados son finales propuestos dentro de la rama y se vuelven canónicos únicamente cuando el Responsable fusiona el PR en `main`.

## Después del merge

El integrador verificará el commit real, registrará `integrated` y `closed`, actualizará inventario y conteos, señalará B047 como siguiente lote y retirará este workflow temporal.

## Publicación

No autorizada.
''', encoding='utf-8')

          (delivery / 'batch-report.md').write_text(f'''# Reporte de lote — `{batch}`

## Estado previo al merge

`accepted`

## Resultado compacto

| Campo | Resultado |
|---|---:|
| Planificado | 12 |
| Producido | 12 |
| Preparado para integración | 12 |
| Integrado | 0 |
| Sustituido | 0 |
| Descartado | 0 |
| Candidatos de reserva usados | 0 |
| Fuentes nuevas | 2 |
| Hallazgos bloqueantes abiertos | 0 |
| Hallazgos mayores abiertos | 0 |

## Validación

- GitHub Actions run: `{run_id}`.
- Validación de contenido: conforme.
- `npm test`: conforme.
- `npm run build`: conforme.

## Disposición

El PR #7 queda listo para revisión personal y merge manual del Responsable del proyecto. Los estados `approved`, `verified` y `accepted` se vuelven canónicos únicamente al integrarse en `main`.

## Publicación

No autorizada.
''', encoding='utf-8')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/EXPANSION-WAVE-REGISTER.md deliveries/batch-046-expansion-wave-01-04
          if git diff --cached --quiet; then
            echo 'No final package changes to commit.'
            exit 0
          fi
          git commit -m 'chore: prepare batch 046 for owner review'
          git push origin HEAD:agent/batch-046-expansion-wave-01-04
