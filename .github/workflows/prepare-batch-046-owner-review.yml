name: Prepare Batch 046 for owner review

on:
  push:
    branches:
      - agent/batch-046-expansion-wave-01-04

permissions:
  contents: write

jobs:
  prepare:
    if: github.event.head_commit.message != 'chore: prepare batch 046 for owner review'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout batch branch
        uses: actions/checkout@v4
        with:
          ref: agent/batch-046-expansion-wave-01-04
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Validate batch content
        working-directory: frontend
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile } from 'node:fs/promises'
          import { join, resolve } from 'node:path'
          import { parse } from 'yaml'
          const repo = resolve('..')
          const batch = 'batch-046-expansion-wave-01-04'
          async function files(dir) {
            const entries = await readdir(dir, { withFileTypes: true })
            return (await Promise.all(entries.map(async (entry) => {
              const path = join(dir, entry.name)
              if (entry.isDirectory()) return files(path)
              return entry.name.endsWith('.md') && entry.name !== 'AGENTS.md' ? [path] : []
            }))).flat()
          }
          async function record(path) {
            const text = await readFile(path, 'utf8')
            const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---/)
            if (!match) throw new Error(`Frontmatter ausente: ${path}`)
            return parse(match[1])
          }
          const entities = await Promise.all((await files(join(repo, 'content/entities'))).map(record))
          const sources = await Promise.all((await files(join(repo, 'content/sources'))).map(record))
          const batchEntities = entities.filter((x) => x.batch === batch)
          const batchSources = sources.filter((x) => x.batch === batch)
          if (batchEntities.length !== 12) throw new Error(`Entidades B046: ${batchEntities.length}`)
          if (batchSources.length !== 2) throw new Error(`Fuentes B046: ${batchSources.length}`)
          for (const item of [...batchEntities, ...batchSources]) {
            if (item.editorialStatus !== 'approved' || item.verificationStatus !== 'verified' || !item.reviewedAt) {
              throw new Error(`Estado final inválido: ${item.id}`)
            }
          }
          console.log('B046: 12 entidades y 2 fuentes approved/verified.')
          EOF

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Run build
        working-directory: frontend
        run: npm run build

      - name: Prepare and commit final package
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          batch = 'batch-046-expansion-wave-01-04'
          run_id = os.environ['RUN_ID']
          register = Path('work/EXPANSION-WAVE-REGISTER.md')
          text = register.read_text(encoding='utf-8')
          text = text.replace(
              '| `batch-046-expansion-wave-01-04` | `wave-01` | 12 | `candidate-tree` | `candidate-data-type` | `authorized` |',
              '| `batch-046-expansion-wave-01-04` | `wave-01` | 12 | `candidate-tree` | `candidate-data-type` | `accepted` |',
          )
          transitions = [
              '| `batch-046-expansion-wave-01-04` | `2026-07-27` | `authorized` | `in-production` | Preflight conforme y alcance exacto de 12 candidatos cargado. |',
              '| `batch-046-expansion-wave-01-04` | `2026-07-27` | `in-production` | `in-review` | Producción 12/12, 2 fuentes y autoevaluación conformes. |',
              f'| `batch-046-expansion-wave-01-04` | `2026-07-27` | `in-review` | `accepted` | 12 entidades y 2 fuentes en `approved` / `verified`; workflow run `{run_id}`, tests y build conformes; PR #7 listo para revisión y merge manual. |',
          ]
          for transition in transitions:
              if transition not in text:
                  text = text.rstrip() + '\n' + transition + '\n'
          register.write_text(text, encoding='utf-8')

          delivery = Path(f'deliveries/{batch}')
          (delivery / 'validation-report.md').write_text(f'''# Validación — `{batch}`

## Estado

`conforming-for-owner-review`

## Resultado automatizado

- GitHub Actions run final: `{run_id}`.
- Entidades: 12/12 en `approved` / `verified`.
- Fuentes nuevas: 2/2 en `approved` / `verified`.
- Validación de contenido: conforme.
- `npm test`: conforme.
- `npm run build`: conforme.

## Disposición

El lote queda en `accepted` y el PR #7 puede entregarse al Responsable del proyecto.
''', encoding='utf-8')
          (delivery / 'review-gate-status.md').write_text(f'''# Estado de entrega para revisión del Responsable — `{batch}`

## Estado

`ready-for-owner-review`

## Paquete final propuesto

- 12 entidades en `approved` / `verified`.
- 2 fuentes nuevas en `approved` / `verified`.
- Lote en `accepted`.
- Preflight, investigación y autoevaluación conformes.
- Validación, `npm test` y `npm run build` conformes en run `{run_id}`.
- PR #7 sin cambios operativos pendientes antes del merge.

## Después del merge

El integrador verificará el commit real, registrará `integrated` y `closed`, actualizará inventario y conteos, y señalará B047 como siguiente lote.

## Publicación

No autorizada.
''', encoding='utf-8')
          (delivery / 'batch-report.md').write_text(f'''# Reporte de lote — `{batch}`

## Estado previo al merge

`accepted`

## Resultado compacto

| Campo | Resultado |
|---|---:|
| Planificado | 12 |
| Producido | 12 |
| Preparado para integración | 12 |
| Integrado | 0 |
| Sustituido | 0 |
| Descartado | 0 |
| Fuentes nuevas | 2 |
| Hallazgos bloqueantes abiertos | 0 |
| Hallazgos mayores abiertos | 0 |

## Validación

- GitHub Actions run final: `{run_id}`.
- Validación de contenido: conforme.
- `npm test`: conforme.
- `npm run build`: conforme.

## Disposición

El PR #7 queda listo para revisión personal y merge manual del Responsable del proyecto.

## Publicación

No autorizada.
''', encoding='utf-8')
          PY

          rm .github/workflows/prepare-batch-046-owner-review.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add work/EXPANSION-WAVE-REGISTER.md deliveries/batch-046-expansion-wave-01-04 .github/workflows/prepare-batch-046-owner-review.yml
          git commit -m 'chore: prepare batch 046 for owner review'
          git push origin HEAD:agent/batch-046-expansion-wave-01-04
