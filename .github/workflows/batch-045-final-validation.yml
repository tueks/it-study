name: Batch 045 final validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    if: github.head_ref == 'agent/batch-045-expansion-wave-01-03'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Validate batch 045 content
        working-directory: frontend
        run: |
          node --input-type=module <<'EOF'
          import { readdir, readFile } from 'node:fs/promises'
          import { join, relative, resolve } from 'node:path'
          import { parse } from 'yaml'

          const repo = resolve('..')
          const batch = 'batch-045-expansion-wave-01-03'
          const expected = new Set([
            'entity-data-compression',
            'entity-lossless-compression',
            'entity-lossy-compression',
            'entity-information-theory',
            'entity-entropy',
            'entity-floating-point-representation',
            'entity-array',
            'entity-linked-list',
            'entity-stack',
            'entity-queue',
            'entity-deque',
            'entity-hash-table',
          ])
          const expectedSources = new Set([
            'source-shannon-mathematical-theory-communication-1948',
            'source-ieee-754-2019',
            'source-rfc-1951-deflate',
            'source-itu-t-t81-jpeg',
            'source-nist-dads',
          ])
          const allowedAliasKinds = new Set(['acronym','translation','notation','common','alternate','historical'])
          const allowedSourceTypes = new Set(['primary-source','institutional-source','standard','official-documentation','academic-publication','secondary-source','vendor-source','historical-source'])

          async function markdownFiles(dir) {
            const entries = await readdir(dir, { withFileTypes: true })
            const nested = await Promise.all(entries.map(async (entry) => {
              const path = join(dir, entry.name)
              if (entry.isDirectory()) return markdownFiles(path)
              if (!entry.name.endsWith('.md') || entry.name === 'AGENTS.md') return []
              return [path]
            }))
            return nested.flat().sort()
          }

          async function record(path) {
            const text = await readFile(path, 'utf8')
            const match = text.match(/^---\r?\n([\s\S]*?)\r?\n---/)
            if (!match) throw new Error(`Frontmatter ausente: ${relative(repo, path)}`)
            const data = parse(match[1])
            return { ...data, sourcePath: relative(repo, path).replaceAll('\\', '/') }
          }

          const entities = await Promise.all((await markdownFiles(join(repo, 'content/entities'))).map(record))
          const sources = await Promise.all((await markdownFiles(join(repo, 'content/sources'))).map(record))
          const batchEntities = entities.filter((item) => item.batch === batch)
          const batchSources = sources.filter((item) => item.batch === batch)
          const errors = []
          const assert = (condition, message) => { if (!condition) errors.push(message) }

          const globalIds = new Set()
          for (const item of [...entities, ...sources]) {
            assert(!globalIds.has(item.id), `ID duplicado global: ${item.id}`)
            globalIds.add(item.id)
          }

          assert(batchEntities.length === 12, `Entidades del lote: ${batchEntities.length}, esperado 12`)
          assert(batchSources.length === 5, `Fuentes del lote: ${batchSources.length}, esperado 5`)
          assert([...expected].every((id) => batchEntities.some((x) => x.id === id)), 'Las entidades no coinciden con el inventario autorizado')
          assert([...expectedSources].every((id) => batchSources.some((x) => x.id === id)), 'Las fuentes no coinciden con el plan')

          const entityIds = new Set(entities.map((x) => x.id))
          const sourceIds = new Set(sources.map((x) => x.id))
          const aliasOwner = new Map()
          const normalize = (value) => value.normalize('NFD').replace(/\p{Diacritic}/gu, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim()

          for (const item of batchEntities) {
            assert(['in-review','approved'].includes(item.editorialStatus), `${item.id}: editorialStatus inválido ${item.editorialStatus}`)
            assert(['pending','verified'].includes(item.verificationStatus), `${item.id}: verificationStatus inválido ${item.verificationStatus}`)
            assert((item.editorialStatus === 'approved') === (item.verificationStatus === 'verified'), `${item.id}: estados inconsistentes`)
            if (item.editorialStatus === 'approved') assert(Boolean(item.reviewedAt), `${item.id}: reviewedAt ausente`)
            assert(item.primaryDomain === 'domain-fundamentos-computacion', `${item.id}: dominio incorrecto`)
            assert(Array.isArray(item.subdomains) && item.subdomains.length === 1, `${item.id}: subdomain inválido`)
            if (item.type === 'model') for (const field of ['represents','scope','elements']) assert(item[field] !== undefined, `${item.id}: campo model ausente ${field}`)
            if (item.type === 'technology') for (const field of ['problemSolved','capabilities','mechanisms','applicationContexts']) assert(item[field] !== undefined, `${item.id}: campo technology ausente ${field}`)
            for (const source of item.sources ?? []) assert(sourceIds.has(source), `${item.id}: fuente inexistente ${source}`)
            for (const target of item.prerequisites ?? []) {
              assert(target !== item.id, `${item.id}: autorreferencia de prerequisite`)
              assert(entityIds.has(target), `${item.id}: prerequisite inexistente ${target}`)
            }
            for (const target of item.related ?? []) {
              assert(target !== item.id, `${item.id}: autorreferencia related`)
              assert(entityIds.has(target), `${item.id}: related inexistente ${target}`)
            }
            for (const alias of item.aliases ?? []) {
              assert(allowedAliasKinds.has(alias.kind), `${item.id}: alias kind no permitido ${alias.kind}`)
              const key = normalize(alias.value)
              const previous = aliasOwner.get(key)
              assert(!previous || previous === item.id, `${item.id}: alias colisiona con ${previous}: ${alias.value}`)
              aliasOwner.set(key, item.id)
            }
          }

          for (const source of batchSources) {
            assert(['in-review','approved'].includes(source.editorialStatus), `${source.id}: editorialStatus inválido ${source.editorialStatus}`)
            assert(['pending','verified'].includes(source.verificationStatus), `${source.id}: verificationStatus inválido ${source.verificationStatus}`)
            assert((source.editorialStatus === 'approved') === (source.verificationStatus === 'verified'), `${source.id}: estados inconsistentes`)
            if (source.editorialStatus === 'approved') assert(Boolean(source.reviewedAt), `${source.id}: reviewedAt ausente`)
            assert(allowedSourceTypes.has(source.sourceType), `${source.id}: sourceType no permitido ${source.sourceType}`)
          }

          const graph = new Map(entities.map((x) => [x.id, (x.prerequisites ?? []).filter((id) => entityIds.has(id))]))
          const visiting = new Set()
          const visited = new Set()
          function visit(id) {
            if (visiting.has(id)) { errors.push(`Ciclo de prerequisites detectado en ${id}`); return }
            if (visited.has(id)) return
            visiting.add(id)
            for (const dep of graph.get(id) ?? []) visit(dep)
            visiting.delete(id)
            visited.add(id)
          }
          for (const id of expected) visit(id)

          if (errors.length) {
            console.error(errors.map((x) => `- ${x}`).join('\n'))
            process.exit(1)
          }
          console.log(`B045 válido: ${batchEntities.length} entidades y ${batchSources.length} fuentes.`)
          EOF

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Run build
        working-directory: frontend
        run: npm run build

      - name: Prepare final owner review package
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          batch = 'batch-045-expansion-wave-01-03'
          review_date = '2026-07-27'
          changed = 0

          for root in (Path('content/entities'), Path('content/sources')):
              for path in root.rglob('*.md'):
                  text = path.read_text(encoding='utf-8')
                  if f'batch: {batch}' not in text:
                      continue
                  updated = text.replace('editorialStatus: in-review', 'editorialStatus: approved')
                  updated = updated.replace('verificationStatus: pending', 'verificationStatus: verified')
                  if 'reviewedAt:' not in updated:
                      updated = updated.replace(
                          f"createdAt: '{review_date}'\n",
                          f"createdAt: '{review_date}'\nreviewedAt: '{review_date}'\n",
                          1,
                      )
                  if updated != text:
                      path.write_text(updated, encoding='utf-8')
                      changed += 1

          register = Path('work/EXPANSION-WAVE-REGISTER.md')
          text = register.read_text(encoding='utf-8')
          text = text.replace(
              '| `batch-045-expansion-wave-01-03` | `wave-01` | 12 | `candidate-data-compression` | `candidate-hash-table` | `in-review` |',
              '| `batch-045-expansion-wave-01-03` | `wave-01` | 12 | `candidate-data-compression` | `candidate-hash-table` | `accepted` |',
          )
          transition = "| `batch-045-expansion-wave-01-03` | `2026-07-27` | `in-review` | `accepted` | Estados finales preparados en el PR #6; pendiente revisión y merge manual del Responsable del proyecto. |"
          if transition not in text:
              text = text.rstrip() + '\n' + transition + '\n'
          register.write_text(text, encoding='utf-8')

          gate = Path(f'deliveries/{batch}/review-gate-status.md')
          gate.write_text(f'''# Estado de entrega para revisión del Responsable — `{batch}`

## Estado

`ready-for-owner-review`

## Paquete final propuesto

- 12 entidades en `approved` / `verified` dentro de la rama del PR.
- 5 fuentes nuevas en `approved` / `verified` dentro de la rama del PR.
- Lote en `accepted` dentro del registro de ondas.
- Preflight, investigación, autoevaluación, validación, `npm test` y `npm run build` conformes.
- PR #6 preparado sin cambios operativos pendientes antes del merge.

## Semántica de los estados

Los estados preparados en la rama son la propuesta final de integración. No son canónicos mientras el PR permanezca fuera de `main`.

El Responsable del proyecto revisa personalmente el pull request y realiza el merge manual cuando el resultado es conforme. Si solicita cambios, el productor corrige el mismo PR, vuelve a validar y entrega un nuevo último commit.

## Después del merge

Cuando el Responsable informe que aprobó y fusionó el PR, el integrador verificará el merge y su commit real, registrará `accepted` → `integrated` → `closed` y actualizará inventario, conteos, reporte final y siguiente lote.

## Publicación

La aprobación y el cierre interno del lote no autorizan publicación externa.
''', encoding='utf-8')

          report = Path(f'deliveries/{batch}/batch-report.md')
          report.write_text(f'''# Reporte de lote — `{batch}`

## Estado previo al merge

`accepted`

## Resultado compacto

| Campo | Resultado |
|---|---:|
| Planificado | 12 |
| Producido | 12 |
| Preparado para integración | 12 |
| Integrado | 0 |
| Sustituido | 0 |
| Descartado | 0 |
| Fuentes agregadas | 5 |
| Hallazgos bloqueantes abiertos | 0 |
| Hallazgos mayores abiertos | 0 |

## Validación

- Validación de contenido: conforme.
- `npm test`: conforme.
- `npm run build`: conforme.
- GitHub Actions run: `{os.environ.get('RUN_ID', 'pending')}`.

## Disposición

El PR #6 queda listo para revisión humana y merge manual del Responsable del proyecto. Los estados `approved`, `verified` y `accepted` son finales propuestos dentro de la rama y se vuelven canónicos únicamente al integrarse en `main`.

## Publicación

No autorizada.
''', encoding='utf-8')

          print(f'Prepared {changed} records.')
          PY

      - name: Commit final review package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add content/entities content/sources deliveries/batch-045-expansion-wave-01-03 work/EXPANSION-WAVE-REGISTER.md
          if git diff --cached --quiet; then
            echo 'Final review package already prepared.'
            exit 0
          fi
          git commit -m 'chore: prepare batch 045 for owner review'
          git push origin HEAD:${{ github.head_ref }}
