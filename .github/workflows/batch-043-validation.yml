name: Batch 043 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Run build
        working-directory: frontend
        run: npm run build
