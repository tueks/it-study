name: Batch 043 validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run tests and capture output
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm test > test-output.txt 2>&1
          code=$?
          echo "$code" > test-exit-code.txt
          cat test-output.txt
          exit 0

      - name: Run build and capture output
        working-directory: frontend
        shell: bash
        run: |
          set +e
          npm run build > build-output.txt 2>&1
          code=$?
          echo "$code" > build-exit-code.txt
          cat build-output.txt
          exit 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: batch-043-validation-evidence
          path: |
            frontend/test-output.txt
            frontend/test-exit-code.txt
            frontend/build-output.txt
            frontend/build-exit-code.txt
            frontend/src/generated/catalog.json
          if-no-files-found: warn

      - name: Enforce validation result
        working-directory: frontend
        shell: bash
        run: |
          test_code=$(cat test-exit-code.txt)
          build_code=$(cat build-exit-code.txt)
          if [ "$test_code" -ne 0 ] || [ "$build_code" -ne 0 ]; then
            echo "Validation failed: test=$test_code build=$build_code"
            exit 1
          fi
