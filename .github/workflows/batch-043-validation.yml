name: Batch 043 validation

on:
  push:
    branches:
      - agent/batch-043-expansion-wave-01-01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/batch-043-expansion-wave-01-01
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Run build
        working-directory: frontend
        run: npm run build

      - name: Commit regenerated catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/generated/catalog.json
          if git diff --cached --quiet; then
            echo "Catalog already current"
          else
            git commit -m "build: regenerate catalog for batch 043"
            git push origin HEAD:agent/batch-043-expansion-wave-01-01
          fi
